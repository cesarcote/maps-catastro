<div class="container">
  <div class="search-config">
    <label>
      <input type="radio" name="searchType" value="address" [(ngModel)]="searchType" />
      Buscar por Dirección
    </label>
    <label>
      <input type="radio" name="searchType" value="chip" [(ngModel)]="searchType" />
      Buscar por CHIP
    </label>
  </div>

  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="searchValue"
      [placeholder]="searchType === 'address' ? 'Ingrese dirección' : 'Ingrese CHIP'"
    />
    <button type="button" (click)="search()">Buscar</button>
  </div>

  <div class="examples">
    <span>Ejemplos: </span>
    <button
      *ngFor="let example of currentExamples"
      class="example-btn"
      (click)="setExample(example)"
    >
      {{ example }}
    </button>
  </div>

  <div class="layer-panel">
    <div class="layer-header">
      <strong>Capas dinámicas</strong>
      <span>{{ selectedLayerCount }} IDs activos</span>
    </div>

    <div class="layer-row">
      <label for="layerPreset">Preset</label>
      <select id="layerPreset" [(ngModel)]="layerPreset" (change)="onLayerPresetChange()">
        <option *ngFor="let option of layerPresetOptions" [value]="option.key">
          {{ option.label }}
        </option>
      </select>
      <button type="button" (click)="selectAllLayers()">Todas</button>
      <button type="button" (click)="clearLayerSelection()">Ninguna</button>
    </div>

    <div class="layer-row">
      <label for="layerIdsInput">IDs</label>
      <input
        id="layerIdsInput"
        type="text"
        [(ngModel)]="layerIdsInput"
        placeholder="Ej: 3, 9, 19, 27"
      />
      <button type="button" (click)="applyLayerIdsFromInput()">Aplicar IDs</button>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div id="mapContainer" #mapContainer></div>
</div>
