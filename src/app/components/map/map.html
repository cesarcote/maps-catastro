<div class="container">
  <div class="search-config">
    <label>
      <input type="radio" name="searchType" value="address" [(ngModel)]="searchType" />
      Buscar por Dirección
    </label>
    <label>
      <input type="radio" name="searchType" value="chip" [(ngModel)]="searchType" />
      Buscar por CHIP
    </label>
  </div>

  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="searchValue"
      [placeholder]="searchType === 'address' ? 'Ingrese dirección' : 'Ingrese CHIP'"
    />
    <button type="button" (click)="search()">Buscar</button>
  </div>

  <div class="examples">
    <span>Ejemplos: </span>
    <button
      *ngFor="let example of currentExamples"
      class="example-btn"
      (click)="setExample(example)"
    >
      {{ example }}
    </button>
  </div>

  <!-- Layer Mode Panel -->
  <div class="layer-panel">
    <div class="layer-header">
      <strong>Capas del mapa</strong>
      <div class="mode-toggle">
        <button
          type="button"
          class="mode-btn"
          [class.active]="layerMode === 'base'"
          (click)="setLayerMode('base')"
        >
          🗺️ Mapa Base
        </button>
        <button
          type="button"
          class="mode-btn"
          [class.active]="layerMode === 'filter'"
          (click)="setLayerMode('filter')"
        >
          🔍 Filtrar Capas
        </button>
      </div>
    </div>

    <!-- Base mode info -->
    <div *ngIf="layerMode === 'base'" class="mode-info">
      Usando cache de tiles — todas las capas visibles a todos los niveles de zoom.
    </div>

    <!-- Filter mode: thematic group checkboxes -->
    <div *ngIf="layerMode === 'filter'" class="filter-section">
      <div class="filter-actions">
        <span class="filter-count">{{ checkedGroupCount }} grupos / {{ selectedLayerCount }} IDs activos</span>
        <button type="button" class="action-btn" (click)="selectAllGroups()">Todas</button>
        <button type="button" class="action-btn" (click)="clearAllGroups()">Ninguna</button>
      </div>

      <div class="group-grid">
        <label
          *ngFor="let group of layerGroups"
          class="group-checkbox"
          [class.checked]="group.checked"
        >
          <input
            type="checkbox"
            [(ngModel)]="group.checked"
            (change)="onGroupToggle()"
          />
          <span class="group-label">{{ group.label }}</span>
          <span class="group-count">{{ group.ids.length }}</span>
        </label>
      </div>
    </div>
  </div>

  <!-- Overlay Layers Panel (works in both modes) -->
  <div class="layer-panel overlay-panel">
    <div class="layer-header">
      <strong>📍 Capas adicionales</strong>
      <span class="mode-info" style="margin: 0">Funcionan sobre cualquier modo</span>
    </div>

    <!-- Nombre Geográfico -->
    <div class="overlay-section">
      <div class="overlay-section-header">
        <strong>Nombre Geográfico</strong>
        <div class="filter-actions">
          <span class="filter-count">{{ checkedNombreGeoCount }} activas</span>
          <button type="button" class="action-btn" (click)="selectAllNombreGeo()">Todas</button>
          <button type="button" class="action-btn" (click)="clearAllNombreGeo()">Ninguna</button>
        </div>
      </div>

      <div class="group-grid">
        <label
          *ngFor="let cat of nombreGeoCategories"
          class="group-checkbox overlay-cat"
          [class.checked]="cat.checked"
        >
          <input
            type="checkbox"
            [(ngModel)]="cat.checked"
            (change)="onNombreGeoToggle()"
          />
          <span
            class="cat-dot"
            [style.background-color]="cat.color"
          ></span>
          <span class="group-label">{{ cat.emoji }} {{ cat.label }}</span>
        </label>
      </div>
    </div>

    <!-- TransMilenio Troncales -->
    <div class="overlay-section">
      <label class="group-checkbox troncal-toggle" [class.checked]="showTroncales">
        <input
          type="checkbox"
          [(ngModel)]="showTroncales"
          (change)="onTroncalesToggle()"
        />
        <span
          class="cat-dot"
          style="background-color: #e3192f"
        ></span>
        <span class="group-label">🚉 Estaciones Troncales TransMilenio</span>
      </label>
    </div>
  </div>

  <div *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </div>

  <div id="mapContainer" #mapContainer></div>
</div>
